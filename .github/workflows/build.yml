name: Bauen und Testen

on:
  push:
  pull_request:
  # Erlaubt den Start von Hand im Reiter „Actions" (z. B. wenn GitHub einen Lauf abgebrochen hat).
  workflow_dispatch:

jobs:
  kern:
    name: Kern (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Oberfläche bauen (wird in die Anwendung eingebettet)
        run: |
          corepack enable
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --release

  oberflaeche:
    name: Oberfläche
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  installer:
    name: Installer (${{ matrix.os }})
    needs: [kern, oberflaeche]
    # Installer nur für Pull Requests gegen main (und beim Start von Hand), nicht
    # bei jedem Push: Ein Satz belegt rund 117 MB vom Artefakt-Kontingent des
    # Accounts. Die Installer einer Version baut der Release-Workflow.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    # actions: write nur für das Löschen der älteren Artefakte am Ende.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Installer bauen
        working-directory: app
        # Aus app/ aufrufen: Dort liegt tauri.conf.json.
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: deckwerk-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
          # Installer zum Herunterladen und Ausprobieren; veröffentlicht wird über
          # den Release-Workflow. Das Artefakt-Kontingent gilt für den ganzen Account.
          retention-days: 7
      - name: Ältere Installer-Artefakte löschen
        # Es bleibt nur der eben hochgeladene Satz je System. Bei Pull Requests
        # aus Forks darf das Token nicht löschen; dort greift die Frist oben.
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.upload.outputs.artifact-id }}
          NAME: deckwerk-${{ runner.os }}
        run: |
          # Erst alle Kennungen holen, dann löschen: Sonst verschieben sich die Seiten.
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --paginate --jq '.artifacts[].id' | tr -d '\r')"
          printf '%s\n' "$ids" | while read -r id; do
            if [ -n "$id" ] && [ "$id" != "$KEEP" ]; then
              echo "lösche $NAME $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done
