name: Release

# Ein Tag der Form v1.2.3 baut die Installer für alle drei Systeme und
# veröffentlicht sie als Release. Der Release bleibt ein Entwurf, bis alle
# Installer hochgeladen sind; schlägt ein Bau fehl, wird nichts veröffentlicht.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  entwurf:
    name: Entwurf anlegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag und Version müssen übereinstimmen
        run: |
          version="$(grep -m1 '"version"' app/tauri.conf.json | sed 's/.*"\([0-9][^"]*\)".*/\1/')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG passt nicht zur Version $version in app/tauri.conf.json" >&2
            exit 1
          fi
      - name: Entwurf anlegen
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release create "$TAG" --draft --title "Deckwerk ${TAG#v}" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" --draft --title "Deckwerk ${TAG#v}" --generate-notes
          fi

  installer:
    name: Installer (${{ matrix.os }})
    needs: entwurf
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Installer bauen
        working-directory: app
        # Aus app/ aufrufen: Dort liegt tauri.conf.json.
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build
      - name: Installer an den Release hängen
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(target/release/bundle/**/*.{deb,rpm,AppImage,dmg,msi,exe})
          if [ ${#files[@]} -eq 0 ]; then
            echo "Keine Installer gefunden" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  veroeffentlichen:
    name: Veröffentlichen
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
